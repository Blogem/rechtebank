version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: friday
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: friday
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: friday
    groups:
      docker-backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: friday
    groups:
      docker-frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
