version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: friday
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: friday
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7.0 (the native Go port) ships without a stable programmatic
      # API, so svelte-check and typescript-eslint both refuse to run against it.
      # Scoped to 7.0.x on purpose: when 7.1 lands we want the PR, since that is
      # the release that is supposed to ship the stable API.
      - dependency-name: typescript
        versions:
          - 7.0.x
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: friday
    groups:
      docker-backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: friday
    groups:
      docker-frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
