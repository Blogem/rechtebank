name: Build and Deploy

on:
  push:
    branches: [main]
  # Manual re-run. Needed because build-backend/build-frontend are gated on
  # "did backend/ or frontend/ change since the last commit", so a merged
  # change whose build failed has no way to be rebuilt until something else
  # touches that directory. See the matching override in ci.yml's `changes`
  # job — without it a dispatch finds an empty diff and builds nothing.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/blogem/rechtebank-backend
  FRONTEND_IMAGE: ghcr.io/blogem/rechtebank-frontend
  MANIFEST_REPO: Blogem/infra-workloads
  MANIFEST_PATH: manifests/rechtebank

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-backend:
    needs: [ci]
    if: needs.ci.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Read only by the step condition below, so the Docker Hub login stays a
      # no-op until the secrets exist instead of failing the build outright.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base images (golang, alpine) come from Docker Hub, where anonymous pulls
      # are rate-limited per runner IP; the build then dies with "429 Too Many
      # Requests" before compiling anything. This login is separate from the GHCR one
      # above, which only authorises the push.
      #
      # continue-on-error: auth.docker.io has been observed timing out on its own
      # ("context deadline exceeded"), and a failed login should degrade to the
      # previous anonymous behaviour rather than hard-fail the job before the build
      # starts. Since it is an optimisation, not a requirement, it must not become a
      # new way for the build to die.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

  build-frontend:
    needs: [ci]
    if: needs.ci.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Read only by the step condition below, so the Docker Hub login stays a
      # no-op until the secrets exist instead of failing the build outright.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See the note on build-backend: the node base image is pulled anonymously
      # from Docker Hub, which is rate-limited per runner IP, and a failed login
      # must not become a new way for the build to die.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  update-manifests:
    needs: [ci, build-backend, build-frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest repo
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.MANIFEST_REPO_PAT }}

      - name: Update backend image tag
        if: needs.build-backend.result == 'success'
        run: |
          sed -i "s|image: ${{ env.BACKEND_IMAGE }}:.*|image: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}|" ${{ env.MANIFEST_PATH }}/backend-deployment.yaml

      - name: Update frontend image tag
        if: needs.build-frontend.result == 'success'
        run: |
          sed -i "s|image: ${{ env.FRONTEND_IMAGE }}:.*|image: ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}|" ${{ env.MANIFEST_PATH }}/frontend-deployment.yaml

      - name: Commit and push
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MANIFEST_PATH }}/
          git diff --staged --quiet && echo "No changes" && exit 0
          DESCRIPTION=$(echo "$COMMIT_MSG" | head -n1 | cut -c1-72)
          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="update images to sha-${GITHUB_SHA:0:12}"
          fi
          git commit -m "deploy(rechtebank): ${DESCRIPTION}"
          git push || (git pull --rebase && git push)
